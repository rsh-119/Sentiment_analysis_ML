[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-sentiment"
version = "0.1.0"
description = "IMDB sentiment analysis: BiLSTM vs fine-tuned Llama-3.1-8B-Instruct"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
