seed:
  seed: 42
  deterministic: true

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42

llama:
  base_model: "unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit"
  max_seq_len: 512
  load_in_4bit: true
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  positive_token: "Positive"
  negative_token: "Negative"
  lr: 0.0002
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  epochs: 1.0
  warmup_steps: 50
  weight_decay: 0.01
  optim: "adamw_8bit"
  packing: false
  logging_steps: 10
  per_device_eval_batch_size: 16
  train_subset_size: null  # set to e.g. 2000 for a fast dev run; null = full train split

eval:
  batch_size: 8
  latency_num_warmup: 5
  latency_num_runs: 20
